baseURL = 'https://blog.theworldmessage.com/'
title = 'writing just for the sake of it'
theme = 'minimal'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    locale = 'en-US'
    weight = 1

  [languages.cs]
    languageCode = 'cs-CZ'
    languageName = 'Čeština'
    locale = 'cs-CZ'
    weight = 2

[params]
  twitter = "https://x.com/cigsandcoffe3"


[permalinks]
  posts = '/posts/:slug/'

# Keep static assets on the custom domain even if a build sets another baseURL.
canonifyURLs = true

[markup]
  [markup.highlight]
    style = 'monokailight'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
